<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>愛知・犬山・名古屋 旅程ナビ（11/7〜11/8）</title>
  <script>
    (function() {
      var t = localStorage.getItem('trip_nav_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
:root, [data-theme="light"] {
  --bg-canvas: #fafafa;
  --bg-surface: #ffffff;
  --bg-elevated: rgba(255, 255, 255, 0.88);
  --bg-subtle: #f4f4f5;
  --bg-tint: #f8fafc;
  --border-hairline: rgba(0, 0, 0, 0.06);
  --border-divider: rgba(0, 0, 0, 0.05);
  --border-strong: rgba(0, 0, 0, 0.12);
  --text-primary: #09090b;
  --text-secondary: #3f3f46;
  --text-tertiary: #71717a;
  --text-muted: #a1a1aa;
  --accent-primary: #2563eb;
  --accent-primary-soft: rgba(37, 99, 235, 0.07);
  --accent-primary-border: rgba(37, 99, 235, 0.18);
  --sight-ink: #0369a1;
  --sight-dot: #0284c7;
  --sight-bg: rgba(2, 132, 199, 0.07);
  --sight-border: rgba(2, 132, 199, 0.18);
  --food-ink: #c2410c;
  --food-dot: #ea580c;
  --food-bg: rgba(234, 88, 12, 0.07);
  --food-border: rgba(234, 88, 12, 0.18);
  --national-ink: #7e22ce;
  --national-dot: #9333ea;
  --national-bg: rgba(147, 51, 234, 0.07);
  --national-border: rgba(147, 51, 234, 0.2);
  --transit-ink: #52525b;
  --transit-dot: #a1a1aa;
  --transit-bg: #f4f4f5;
  --must-ink: #047857;
  --must-bg: rgba(5, 150, 105, 0.08);
  --must-border: rgba(5, 150, 105, 0.22);
  --skip-ink: #b45309;
  --skip-bg: rgba(245, 158, 11, 0.1);
  --skip-border: rgba(245, 158, 11, 0.32);
  --skip-row-bg: linear-gradient(90deg, rgba(255, 251, 235, 0.65) 0%, rgba(255, 255, 255, 0) 100%);
  --danger-ink: #be123c;
  --danger-bg: rgba(225, 29, 72, 0.06);
  --shadow-ambient: 0 2px 12px -2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.02);
  --shadow-hover: 0 8px 24px -4px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
  --shadow-float: 0 16px 36px -8px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.05);
  --shadow-pill: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
  --rail-line: #e4e4e7;
}

[data-theme="dark"] {
  --bg-canvas: #09090b;
  --bg-surface: #121215;
  --bg-elevated: rgba(18, 18, 21, 0.88);
  --bg-subtle: #18181b;
  --bg-tint: #16161a;
  --border-hairline: rgba(255, 255, 255, 0.07);
  --border-divider: rgba(255, 255, 255, 0.055);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text-primary: #fafafa;
  --text-secondary: #d4d4d8;
  --text-tertiary: #a1a1aa;
  --text-muted: #71717a;
  --accent-primary: #38bdf8;
  --accent-primary-soft: rgba(56, 189, 248, 0.12);
  --accent-primary-border: rgba(56, 189, 248, 0.24);
  --sight-ink: #38bdf8;
  --sight-dot: #0ea5e9;
  --sight-bg: rgba(56, 189, 248, 0.1);
  --sight-border: rgba(56, 189, 248, 0.22);
  --food-ink: #fb923c;
  --food-dot: #f97316;
  --food-bg: rgba(251, 146, 60, 0.1);
  --food-border: rgba(251, 146, 60, 0.22);
  --national-ink: #c084fc;
  --national-dot: #a855f7;
  --national-bg: rgba(192, 132, 252, 0.12);
  --national-border: rgba(192, 132, 252, 0.25);
  --transit-ink: #a1a1aa;
  --transit-dot: #52525b;
  --transit-bg: #18181b;
  --must-ink: #34d399;
  --must-bg: rgba(16, 185, 129, 0.12);
  --must-border: rgba(16, 185, 129, 0.28);
  --skip-ink: #fbbf24;
  --skip-bg: rgba(245, 158, 11, 0.14);
  --skip-border: rgba(245, 158, 11, 0.32);
  --skip-row-bg: linear-gradient(90deg, rgba(245, 158, 11, 0.08) 0%, rgba(18, 18, 21, 0) 100%);
  --danger-ink: #fda4af;
  --danger-bg: rgba(244, 63, 94, 0.12);
  --shadow-ambient: 0 2px 12px -2px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-hover: 0 10px 28px -4px rgba(0, 0, 0, 0.6);
  --shadow-float: 0 20px 44px -8px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
  --shadow-pill: 0 1px 4px rgba(0, 0, 0, 0.5);
  --rail-line: #27272a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic", sans-serif;
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  line-height: 1.55;
  letter-spacing: -0.015em;
  font-feature-settings: "palt" 1, "kern" 1;
  padding-bottom: 96px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Sticky Top Navigation & Filter Bar */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-elevated);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border-hairline);
}

.header-inner {
  max-width: 780px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.header-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand-cluster {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-hairline);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
}

.brand-titles {
  display: flex;
  align-items: baseline;
  gap: 7px;
  min-width: 0;
}

.brand-name {
  font-size: 0.96rem;
  font-weight: 750;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  white-space: nowrap;
}

.badge-beta {
  font-size: 0.6rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 9999px;
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
  border: 1px solid var(--accent-primary-border);
  letter-spacing: 0.04em;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.btn-pill {
  font-family: inherit;
  font-size: 0.74rem;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 9999px;
  border: 1px solid var(--border-hairline);
  background: var(--bg-surface);
  color: var(--text-primary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-ambient);
}

.btn-pill:hover {
  border-color: var(--border-strong);
}

/* Unified Compact Segmented Controls in Header */
.header-controls-row {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}

.header-controls-row::-webkit-scrollbar {
  display: none;
}

.segmented-pill-group {
  display: inline-flex;
  background: var(--bg-subtle);
  padding: 2.5px;
  border-radius: 10px;
  border: 1px solid var(--border-hairline);
  gap: 2px;
  flex-shrink: 0;
}

.seg-btn {
  font-family: inherit;
  font-size: 0.73rem;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 7.5px;
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.seg-btn:hover {
  color: var(--text-primary);
}

.seg-btn.active,
.seg-btn.active-cat {
  background: var(--bg-surface);
  color: var(--text-primary);
  font-weight: 700;
  box-shadow: var(--shadow-pill);
}

.seg-count {
  font-size: 0.65rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
  background: var(--bg-subtle);
  padding: 0 5px;
  border-radius: 9999px;
}

.seg-btn.active .seg-count,
.seg-btn.active-cat .seg-count {
  background: var(--accent-primary-soft);
  color: var(--accent-primary);
}

/* Main Content Container */
.main-wrapper {
  max-width: 780px;
  margin: 0 auto;
  padding: 14px 16px 28px;
}

/* Quick-Jump Spot Strip (Horizontal Swipe) */
.quick-jump-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0 12px;
}

.quick-jump-bar::-webkit-scrollbar {
  display: none;
}

.jump-chip {
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  padding: 5px 11px;
  border-radius: 9999px;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  box-shadow: var(--shadow-ambient);
  transition: all 0.15s ease;
  text-decoration: none;
}

.jump-chip:hover {
  border-color: var(--border-strong);
  color: var(--text-primary);
  transform: translateY(-1px);
}

/* Legend & Strategy Strip */
.legend-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: 12px;
  padding: 9px 14px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-ambient);
  font-size: 0.74rem;
  color: var(--text-secondary);
}

.legend-items {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* Day Section */
.day-block {
  margin-bottom: 34px;
}

.day-header-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-ambient);
}

.day-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.day-title-cluster {
  display: flex;
  align-items: center;
  gap: 9px;
}

.day-eyebrow {
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--text-primary);
  color: var(--bg-surface);
}

.day-date-text {
  font-size: 1.02rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.day-route-map-btn {
  font-size: 0.73rem;
  font-weight: 600;
  color: var(--accent-primary);
  background: var(--accent-primary-soft);
  border: 1px solid var(--accent-primary-border);
  padding: 5px 11px;
  border-radius: 9999px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s ease;
}

.day-route-map-btn:hover {
  background: var(--accent-primary);
  color: #ffffff;
}

.day-subtitle-text {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.macro-flow-strip {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-top: 8px;
  border-top: 1px solid var(--border-divider);
}

.macro-flow-strip::-webkit-scrollbar {
  display: none;
}

.macro-chip {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-subtle);
  padding: 3px 8px;
  border-radius: 6px;
  white-space: nowrap;
}

.macro-arrow {
  font-size: 0.65rem;
  color: var(--text-muted);
}

/* Vertical Stepper Rail */
.timeline-vertical {
  position: relative;
  padding-left: 24px;
}

.timeline-vertical::before {
  content: "";
  position: absolute;
  top: 18px;
  bottom: 18px;
  left: 7px;
  width: 2px;
  background: var(--rail-line);
  border-radius: 2px;
}

.slot-node {
  position: relative;
  margin-bottom: 14px;
  scroll-margin-top: 110px;
}

.slot-node:last-child {
  margin-bottom: 0;
}

/* Stepper Dots */
.slot-node::before {
  content: "";
  position: absolute;
  top: 20px;
  left: -22px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--bg-surface);
  border: 3px solid var(--transit-dot);
  box-shadow: 0 0 0 3px var(--bg-canvas);
  z-index: 2;
}

.slot-node.node-sight::before {
  border-color: var(--sight-dot);
  width: 13px;
  height: 13px;
}

.slot-node.node-food::before {
  border-color: var(--food-dot);
  width: 13px;
  height: 13px;
}

.slot-node.node-national::before {
  border-color: var(--national-dot);
  background: #f59e0b;
  width: 14px;
  height: 14px;
  left: -23px;
}

.slot-node.node-transit::before {
  top: 18px;
  width: 10px;
  height: 10px;
  left: -21px;
  border-width: 2px;
  background: var(--bg-canvas);
}

/* Unified Default-Open Slot Card */
.spot-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: 16px;
  box-shadow: var(--shadow-ambient);
  overflow: hidden;
  transition: box-shadow 0.2s ease;
}

.spot-card:hover {
  box-shadow: var(--shadow-hover);
}

.spot-card-head {
  padding: 15px 18px 12px;
}

.spot-card.is-transit .spot-card-head {
  padding: 12px 16px 10px;
}

.spot-meta-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.spot-time-cluster {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.spot-time {
  font-size: 0.8rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.spot-duration {
  font-size: 0.7rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
  background: var(--bg-subtle);
  padding: 1px 7px;
  border-radius: 6px;
}

.spot-badges {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.pill-badge {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 9999px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.pill-badge.sightseeing {
  background: var(--sight-bg);
  color: var(--sight-ink);
  border: 1px solid var(--sight-border);
}

.pill-badge.food {
  background: var(--food-bg);
  color: var(--food-ink);
  border: 1px solid var(--food-border);
}

.pill-badge.national {
  background: var(--national-bg);
  color: var(--national-ink);
  border: 1px solid var(--national-border);
}

.pill-badge.transit {
  background: var(--transit-bg);
  color: var(--transit-ink);
  border: 1px solid var(--border-hairline);
}

.spot-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 5px;
}

.spot-title {
  font-size: 1.04rem;
  font-weight: 750;
  color: var(--text-primary);
  line-height: 1.38;
  letter-spacing: -0.018em;
}

.spot-card.is-transit .spot-title {
  font-size: 0.92rem;
}

.spot-map-pill {
  font-size: 0.71rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-subtle);
  border: 1px solid var(--border-hairline);
  padding: 4px 10px;
  border-radius: 9999px;
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.15s ease;
}

.spot-map-pill:hover {
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.spot-overview {
  font-size: 0.81rem;
  color: var(--text-secondary);
  line-height: 1.55;
}

/* Unified Route & Checkpoints Section (Default Open, Zero Duplication) */
.slot-details-body {
  border-top: 1px solid var(--border-divider);
}

body.compact-mode .slot-details-body {
  display: none;
}

.checkpoint-list {
  display: flex;
  flex-direction: column;
}

.checkpoint-row {
  padding: 11px 18px;
  border-bottom: 1px solid var(--border-divider);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: opacity 0.18s ease, background-color 0.18s ease;
}

.spot-card.is-transit .checkpoint-row {
  padding: 9px 16px;
}

.checkpoint-row.is-optional {
  background: var(--skip-row-bg);
}

.checkpoint-row.is-skipped {
  opacity: 0.42;
}

.checkpoint-row.is-skipped .cp-title {
  text-decoration: line-through;
}

.cp-num {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--bg-subtle);
  color: var(--text-secondary);
  font-size: 0.68rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}

.cp-content {
  flex: 1;
  min-width: 0;
}

.cp-top-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 3px;
}

.cp-title-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.cp-badge {
  font-size: 0.64rem;
  font-weight: 750;
  padding: 1px 7px;
  border-radius: 5px;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.cp-badge.must {
  background: var(--must-bg);
  color: var(--must-ink);
  border: 1px solid var(--must-border);
}

.cp-badge.skippable {
  background: var(--skip-bg);
  color: var(--skip-ink);
  border: 1px solid var(--skip-border);
  cursor: pointer;
  user-select: none;
}

.cp-badge.skippable:hover {
  opacity: 0.85;
}

.cp-title {
  font-size: 0.84rem;
  font-weight: 750;
  color: var(--text-primary);
  line-height: 1.4;
}

.cp-pin-link {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--accent-primary);
  background: var(--accent-primary-soft);
  border: 1px solid var(--accent-primary-border);
  padding: 2px 8px;
  border-radius: 6px;
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
}

.cp-pin-link:hover {
  background: var(--accent-primary);
  color: #ffffff;
}

.cp-desc {
  font-size: 0.77rem;
  color: var(--text-secondary);
  line-height: 1.52;
}

/* Concise Practical Footer (Transit / Tips / Skip Limit) */
.practical-footer {
  padding: 9px 18px 11px;
  background: var(--bg-tint);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.spot-card.is-transit .practical-footer {
  padding: 8px 16px 10px;
}

.pf-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 0.74rem;
  line-height: 1.45;
}

.pf-tag {
  font-size: 0.65rem;
  font-weight: 700;
  min-width: 74px;
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.pf-tag.gate {
  color: var(--danger-ink);
}

.pf-val {
  color: var(--text-secondary);
}

/* Floating Bottom Pill Dock */
.bottom-floating-bar {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 28px);
  max-width: 440px;

    let skippedMap = {};

    try {
      skippedMap = JSON.parse(localStorage.getItem('aichi_skipped_cp') || '{}');
    } catch (_) {
      skippedMap = {};
    }

    function updateFilterCounts() {
      const activeDays = TRIP_DATA.days.filter(d =>
        TRIP_DATA.activeDayFilter === 'all' || String(d.dayNum) === TRIP_DATA.activeDayFilter
      );
      const allItems = activeDays.reduce((acc, d) => acc.concat(d.items), []);
      const sightCount = allItems.filter(i => i.category === 'sightseeing').length;
      const foodCount = allItems.filter(i => i.category === 'food').length;

      const elAll = document.getElementById('count-all');
      const elSight = document.getElementById('count-sightseeing');
      const elFood = document.getElementById('count-food');
      if (elAll) elAll.textContent = String(allItems.length);
      if (elSight) elSight.textContent = String(sightCount);
      if (elFood) elFood.textContent = String(foodCount);
    }

    function renderQuickJumpBar() {
      const jumpBar = document.getElementById('quick-jump-bar');
      if (!jumpBar) return;
      const jumpTargets = [
        { id: 'd1-nagoya-castle', day: '1', cat: 'sightseeing', label: '🏯 名古屋城・本丸御殿' },
        { id: 'd1-ogura-buffer', day: '1', cat: 'food', label: '🍞 小倉トースト（自由選択）' },
        { id: 'd1-atsuta-jingu', day: '1', cat: 'sightseeing', label: '⛩️ 熱田神宮・草薙館' },
        { id: 'd1-yume-wo-katare', day: '1', cat: 'food', label: '🍜 夢を語れ愛知' },
        { id: 'd2-inuyama-castle', day: '2', cat: 'sightseeing', label: '🏯 国宝犬山城・三光稲荷' },
        { id: 'd2-urakuen-joan', day: '2', cat: 'sightseeing', label: '🍵 国宝茶室 如庵' },
        { id: 'd2-inuyama-castle-town', day: '2', cat: 'food', label: '🍡 城下町・山田五平餅' },
        { id: 'd2-momotaro-shrine', day: '2', cat: 'sightseeing', label: '🍑 桃太郎神社' },
        { id: 'd2-jakkoin-temple', day: '2', cat: 'sightseeing', label: '🍁 継鹿尾山 寂光院' }
      ].filter(t => {
        if (TRIP_DATA.activeDayFilter !== 'all' && TRIP_DATA.activeDayFilter !== t.day) return false;
        if (TRIP_DATA.activeCategoryFilter !== 'all' && TRIP_DATA.activeCategoryFilter !== t.cat) return false;
        return true;
      });

      jumpBar.innerHTML = jumpTargets.map(t =>
        `<a href="#slot-${t.id}" class="jump-chip">${t.label}</a>`
      ).join('');
    }

    function toggleSkipCheckpoint(cpKey) {
      skippedMap[cpKey] = !skippedMap[cpKey];
      try {
        localStorage.setItem('aichi_skipped_cp', JSON.stringify(skippedMap));
      } catch (_) {}
      renderUI();
    }

    function toggleMustOnly() {
      mustOnlyMode = !mustOnlyMode;
      const btn = document.getElementById('must-only-btn');
      if (btn) {
        btn.innerHTML = mustOnlyMode
          ? '<span style="color:var(--accent-primary);font-weight:750;">⚡ 必須のみ表示: ON</span>'
          : '<span>⚡ 必須のみ表示: OFF</span>';
      }
      renderUI();
    }

    function toggleCompactMode() {
      compactMode = !compactMode;
      document.body.classList.toggle('compact-mode', compactMode);
      const btn = document.getElementById('btn-compact');
      if (btn) {
        btn.innerHTML = compactMode
          ? '<span>↕️ 全解説を表示（標準）</span>'
          : '<span>↕️ コンパクト一覧に切替</span>';
      }
    }

    function renderUI() {
      updateFilterCounts();
      renderQuickJumpBar();
      const container = document.getElementById('timeline-container');
      container.innerHTML = '';

      TRIP_DATA.days.forEach(day => {
        if (TRIP_DATA.activeDayFilter !== 'all' && TRIP_DATA.activeDayFilter !== String(day.dayNum)) {
          return;
        }

        const filteredItems = day.items.filter(item => {
          if (TRIP_DATA.activeCategoryFilter === 'all') return true;
          return item.category === TRIP_DATA.activeCategoryFilter;
        });

        if (filteredItems.length === 0) {
          const emptyEl = document.createElement('div');
          emptyEl.className = 'day-block';
          emptyEl.innerHTML = `
            <div class="day-header-card">
              <div class="day-header-top">
                <div class="day-title-cluster">
                  <span class="day-eyebrow">DAY 0${day.dayNum}</span>
                  <span class="day-date-text">${day.dateStr}</span>
                </div>
              </div>
              <div style="font-size:0.8rem; color:var(--text-tertiary); margin-top:6px;">
                選択されたカテゴリに該当するスロットはありません。
              </div>
            </div>
          `;
          container.appendChild(emptyEl);
          return;
        }

        const dayEl = document.createElement('div');
        dayEl.className = 'day-block';

        const macroStripHtml = day.macroRoute.map((stepName, idx) => {
          const arrow = idx < day.macroRoute.length - 1 ? '<span class="macro-arrow">➔</span>' : '';
          return '<span class="macro-chip">' + stepName + '</span>' + arrow;
        }).join('');

        const slotsHtml = filteredItems.map(item => {
          const isTransit = item.category === 'transit';
          const f = item.factors || {};
          const rawCheckpoints = item.checkpoints || [];
          const visibleCheckpoints = mustOnlyMode
            ? rawCheckpoints.filter(cp => cp.must)
            : rawCheckpoints;

          const checkpointsHtml = visibleCheckpoints.map((cp, idx) => {
            const cpKey = item.id + '-cp-' + idx;
            const isSkipped = Boolean(skippedMap[cpKey]);
            const badgeHtml = cp.must
              ? '<span class="cp-badge must">必須</span>'
              : `<span class="cp-badge skippable" onclick="toggleSkipCheckpoint('${cpKey}')" title="タップでスキップ打消し切替">${isSkipped ? 'スキップ済（戻す）' : 'スキップ可'}</span>`;

            const pinHtml = cp.mapUrl
              ? `<a href="${cp.mapUrl}" target="_blank" rel="noopener" class="cp-pin-link">📍 地図 ↗</a>`
              : '';

            return `
              <div class="checkpoint-row ${cp.must ? '' : 'is-optional'} ${isSkipped ? 'is-skipped' : ''}">
                <span class="cp-num">${idx + 1}</span>
                <div class="cp-content">
                  <div class="cp-top-line">
                    <div class="cp-title-group">
                      ${badgeHtml}
                      <span class="cp-title">${cp.title}</span>
                    </div>
                    ${pinHtml}
                  </div>
                  <div class="cp-desc">${cp.desc}</div>
                </div>
              </div>
            `;
          }).join('');

          const practicalFooterHtml = `
            <div class="practical-footer">
              ${f.transit ? `
                <div class="pf-row">
                  <span class="pf-tag">🚗 移動・駐車</span>
                  <span class="pf-val">${f.transit}</span>
                </div>
              ` : ''}
              ${f.tips ? `
                <div class="pf-row">
                  <span class="pf-tag">💡 現地Tips</span>
                  <span class="pf-val">${f.tips}</span>
                </div>
              ` : ''}
              ${f.skipLimit ? `
                <div class="pf-row">
                  <span class="pf-tag gate">⏱ 撤収基準</span>
                  <span class="pf-val">${f.skipLimit}</span>
                </div>
              ` : ''}
            </div>
          `;

          const nodeClass = item.badgeType === 'national'
            ? 'node-national'
            : (item.category === 'food' ? 'node-food' : (item.category === 'sightseeing' ? 'node-sight' : 'node-transit'));

          const catBadgeLabel = item.category === 'food'
            ? '🍴 飯・喫茶'
            : (item.category === 'sightseeing' ? '🏛️ 観光' : '🚆 移動');

          const subBadgeClass = item.badgeType === 'national' ? 'national' : 'transit';

          return `
            <article class="slot-node ${nodeClass}" id="slot-${item.id}">
              <div class="spot-card ${isTransit ? 'is-transit' : ''}">
                <div class="spot-card-head">
                  <div class="spot-meta-bar">
                    <div class="spot-time-cluster">
                      <span class="spot-time">${item.time}</span>
                      <span class="spot-duration">${item.duration}</span>
                    </div>
                    <div class="spot-badges">
                      <span class="pill-badge ${item.category}">${catBadgeLabel}</span>
                      <span class="pill-badge ${subBadgeClass}">${item.badge}</span>
                    </div>
                  </div>
                  <div class="spot-title-row">
                    <h3 class="spot-title">${item.title}</h3>
                    ${item.mapUrl ? `<a href="${item.mapUrl}" target="_blank" rel="noopener" class="spot-map-pill">📍 地図 ↗</a>` : ''}
                  </div>
                  <p class="spot-overview">${item.overview}</p>
                </div>

                <!-- Unified Default-Open Route Checkpoints & Practical Footer -->
                <div class="slot-details-body">
                  <div class="checkpoint-list">
                    ${checkpointsHtml}
                  </div>
                  ${practicalFooterHtml}
                </div>
              </div>
            </article>
          `;
        }).join('');

        dayEl.innerHTML = `
          <div class="day-header-card">
            <div class="day-header-top">
              <div class="day-title-cluster">
                <span class="day-eyebrow">DAY 0${day.dayNum}</span>
                <span class="day-date-text">${day.dateStr}</span>
              </div>
              <a href="${day.fullMapUrl}" target="_blank" rel="noopener" class="day-route-map-btn">
                <span>🗺️ Day ${day.dayNum} 全経由地マップ ↗</span>
              </a>
            </div>
            <div class="day-subtitle-text">${day.subTitle}</div>
            <div class="macro-flow-strip">${macroStripHtml}</div>
          </div>
          <div class="timeline-vertical">${slotsHtml}</div>
        `;

        container.appendChild(dayEl);
      });

      const curDay = TRIP_DATA.days.find(d => String(d.dayNum) === TRIP_DATA.activeDayFilter);
      const bMap = document.getElementById('bottom-map-link');
      if (bMap) {
        bMap.href = curDay ? curDay.fullMapUrl : TRIP_DATA.days[1].fullMapUrl;
      }
    }

    function filterDay(dayKey) {
      TRIP_DATA.activeDayFilter = dayKey;
      document.querySelectorAll('#day-segments .seg-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('day-' + dayKey + '-btn');
      if (activeBtn) activeBtn.classList.add('active');
      renderUI();
    }

    function filterCategory(catKey) {
      TRIP_DATA.activeCategoryFilter = catKey;
      document.querySelectorAll('#cat-segments .seg-btn').forEach(btn => btn.classList.remove('active-cat'));
      const activeBtn = document.getElementById('cat-' + catKey + '-btn');
      if (activeBtn) activeBtn.classList.add('active-cat');
      renderUI();
    }

    function syncThemeButton(theme) {
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (icon && text) {
        icon.textContent = theme === 'dark' ? '🌙' : '☀️';
        text.textContent = theme === 'dark' ? 'ダーク' : 'ライト';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('trip_nav_theme', next);
      syncThemeButton(next);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('trip_nav_theme') || 'light';
      document.documentElement.setAttribute('data-theme', stored);
      syncThemeButton(stored);
      renderUI();
    });
  </script>
</body>
</html>
