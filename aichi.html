* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {

header {

.header-top {

.title {

.header-right {

.theme-toggle-btn {

.weather-icon { font-size: 1.8rem; line-height: 1; }
.weather-body { font-size: 0.82rem; }
.weather-body strong { font-size: 0.88rem; display: block; margin-bottom: 2px; }
.weather-sub { font-size: 0.74rem; opacity: 0.9; line-height: 1.35; }

.menu-panel {

  border: 1px solid var(--border);

  padding: 12px 14px;
  margin-bottom: 16px;

}

.menu-panel-header {

  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;

  font-weight: 800;
  color: var(--text);
}

.copy-btn {

  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s;
}
.copy-btn:hover { background: var(--primary-hover); }

.menu-section-label {
  font-size: 0.72rem;

  margin-bottom: 6px;

.controls-grid {

  margin-bottom: 10px;
}

.segmented-control {

.segment-btn {

.map-buttons-grid {

  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.map-link-btn {

.day-header {

.day-header-top {

  align-items: baseline;
  margin-bottom: 4px;

.day-title { font-size: 1.02rem; font-weight: 800; color: var(--primary); }
.day-date { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }

.macro-flow-box {

  color: var(--text-muted);

}

.timeline-slot {

}

.slot-card {

  box-shadow: var(--shadow-sm);

.slot-card:hover {

.slot-summary {
  list-style: none;

  border-bottom: 1px solid var(--summary-border);

.slot-summary::-webkit-details-marker { display: none; }

.slot-top-row {

  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.slot-time-badge {

  font-size: 0.88rem;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.02em;
}

.badge-tag {

  font-weight: 800;
  padding: 2px 8px;
  border-radius: 9999px;

}
.badge-must { background: rgba(220, 38, 38, 0.12); color: var(--danger); border: 1px solid rgba(220, 38, 38, 0.3); }

.slot-title {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--summary-title);
  line-height: 1.35;
  margin-bottom: 6px;
}

.slot-overview-text {
  font-size: 0.78rem;
  color: var(--summary-text);
  line-height: 1.45;
  margin-bottom: 6px;
}

.slot-expand-hint {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.7rem;
  font-weight: 700;

.slot-body {

  display: flex;
  flex-direction: column;
  gap: 10px;
}

.action-block-card {
  background: var(--card-inner);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}

.action-block-title {
  font-size: 0.82rem;
  font-weight: 800;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.action-block-title.tactics { color: var(--primary); }
.action-block-title.bonus { color: var(--purple); }
.action-block-title.spec { color: var(--accent); }

.micro-step-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.micro-step-row {
  display: flex;
  gap: 8px;
  font-size: 0.8rem;
  align-items: baseline;
  line-height: 1.4;
}
.step-num {
  font-size: 0.68rem;
  font-weight: 800;
  background: var(--primary);
  color: #fff;
  border-radius: 4px;
  padding: 1px 5px;
  white-space: nowrap;
}
.step-tag-must {
  font-size: 0.65rem;
  font-weight: 800;
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: 3px;
  padding: 0 4px;
  margin-left: 4px;
}
.step-tag-opt {
  font-size: 0.65rem;
  font-weight: 800;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0 4px;
  margin-left: 4px;
}

.bonus-item {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
}
.bonus-item-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2px;
}
.bonus-item-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
.bonus-map-link { font-size: 0.72rem; color: var(--map-green); font-weight: 700; text-decoration: none; }

.spec-line {

  font-size: 0.76rem;
  gap: 6px;
  margin-bottom: 4px;
  line-height: 1.4;

.spec-label { font-weight: 800; color: var(--text); min-width: 90px; }
.spec-val { color: var(--text-muted); }
.spec-danger { color: var(--danger); font-weight: 700; }

.slot-map-btn {

.quick-bar {

  font-weight: 700;
  padding: 5px 10px;
  border-radius: 6px;
  text-decoration: none;
  cursor: pointer;

.quick-btn.primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
  </style>
</head>

    function renderUI() {
      const container = document.getElementById('timeline-container');
      container.innerHTML = '';

      TRIP_DATA.days.forEach(day => {
        if (TRIP_DATA.activeDayFilter !== 'all' && TRIP_DATA.activeDayFilter !== String(day.dayNum)) {
          return;
        }

        const dayEl = document.createElement('div');
        dayEl.className = 'day-section';

        let slotsHtml = day.items.map(item => {
          const tacticsHtml = item.tactics && item.tactics.length > 0 ? `
            <div class="action-block-card">
              <div class="action-block-title tactics">
                <span>🚶‍♂️ ${item.tacticsTitle || '立ち回り順路・推奨ステップ'}</span>
              </div>
              <div class="micro-step-list">
                ${item.tactics.map(s => `
                  <div class="micro-step-row">
                    <span class="step-num">Step ${s.step}</span>
                    <div>
                      ${s.text}
                      ${s.must ? '<span class="step-tag-must">必須</span>' : '<span class="step-tag-opt">任意</span>'}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : '';

          const bonusHtml = item.bonusSpots && item.bonusSpots.length > 0 ? `
            <div class="action-block-card">
              <div class="action-block-title bonus">
                <span>🌟 ついで名所・寄り道スポット</span>
              </div>
              ${item.bonusSpots.map(b => `
                <div class="bonus-item">
                  <div class="bonus-item-top">
                    <span class="bonus-item-name">📍 ${b.name}</span>
                    <a href="${b.mapUrl}" target="_blank" class="bonus-map-link">地図 ↗</a>
                  </div>
                  <div class="bonus-item-desc">${b.desc}</div>
                </div>
              `).join('')}
            </div>
          ` : '';

          const specsHtml = item.specs ? `
            <div class="action-block-card">
              <div class="action-block-title spec">
                <span>📋 必須アクションスペック</span>
              </div>
              <div class="spec-line"><span class="spec-label">移動・アクセス:</span><span class="spec-val">${item.specs.transit}</span></div>
              <div class="spec-line"><span class="spec-label">見どころ:</span><span class="spec-val">${item.specs.highlight}</span></div>
              <div class="spec-line"><span class="spec-label">現地Tips:</span><span class="spec-val">${item.specs.tips}</span></div>
              <div class="spec-line"><span class="spec-label">損切りリミット:</span><span class="spec-val spec-danger">${item.specs.skipLimit}</span></div>
            </div>
          ` : '';

          return `
            <div class="timeline-slot">
              <details class="slot-card" open>
                <summary class="slot-summary">
                  <div class="slot-top-row">
                    <span class="slot-time-badge">${item.time} (${item.duration})</span>
                    <span class="badge-tag badge-${item.badgeType}">${item.badge}</span>
                  </div>
                  <div class="slot-title">${item.title}</div>
                  <div class="slot-overview-text">${item.overview}</div>
                  <div class="slot-expand-hint">
                    <span>詳細（立ち回り・スペック）を展開中</span>
                    <span class="slot-expand-arrow">▲</span>
                  </div>
                </summary>
                <div class="slot-body">
                  ${tacticsHtml}
                  ${bonusHtml}
                  ${specsHtml}
                  ${item.mapUrl ? `<a href="${item.mapUrl}" target="_blank" class="slot-map-btn">🗺️ Googleマップで開く ↗</a>` : ''}
                </div>
              </details>
            </div>
          `;
        }).join('');

        dayEl.innerHTML = `
          <div class="day-header">
            <div class="day-header-top">
              <div class="day-title">Day ${day.dayNum}</div>
              <div class="day-date">${day.dateStr}</div>
            </div>
            <div class="day-sub">${day.subTitle}</div>
            <div class="macro-flow-box">
              <div class="macro-flow-label">【マクロ行程フロー】</div>
              <div>${day.macroRoute.join(' ➔ ')}</div>
            </div>
          </div>
          <div class="slots-container">${slotsHtml}</div>
        `;

        container.appendChild(dayEl);
      });
    }

    function filterDay(dayKey) {
      TRIP_DATA.activeDayFilter = dayKey;
      document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('day-' + dayKey + '-btn');
      if (activeBtn) activeBtn.classList.add('active');
      renderUI();
    }

    function copyCurrentPlan() {
      let text = "🏯 【愛知・犬山・名古屋 決定版リアルタイム旅程】\n\n";
      
      TRIP_DATA.days.forEach(day => {
        text += "========================================\n";
        text += "■ " + day.dateStr + " (Day " + day.dayNum + ")\n";
        text += "ルート: " + day.macroRoute.join(' ➔ ') + "\n";
        text += "========================================\n\n";

        day.items.forEach(item => {
          text += "【" + item.time + "】 " + item.title + "\n";
          text += "・概要: " + item.overview + "\n";
          if (item.tactics && item.tactics.length > 0) {
            text += "・立ち回り:\n";
            item.tactics.forEach(t => {
              text += "   " + t.step + ". " + t.text + (t.must ? " [必須]" : " [任意]") + "\n";
            });
          }
          if (item.specs) {
            text += "・移動: " + item.specs.transit + "\n";
            text += "・Tips: " + item.specs.tips + "\n";
            text += "・リミット: " + item.specs.skipLimit + "\n";
          }
          text += "\n";
        });
      });

      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          alert('全日程の旅程テキストをコピーしました！そのままLINE等に貼り付けられます。');
        }).catch(() => {
          prompt('以下のテキストをコピーしてください:', text);
        });
      } else {
        prompt('以下のテキストをコピーしてください:', text);
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('trip_nav_theme', next);
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (icon && text) {
        if (next === 'dark') {
          icon.textContent = '🌙';
          text.textContent = 'ダーク';
        } else {
          icon.textContent = '☀️';
          text.textContent = 'ライト';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('trip_nav_theme') || 'light';
      document.documentElement.setAttribute('data-theme', stored);
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (icon && text) {
        icon.textContent = stored === 'dark' ? '🌙' : '☀️';
        text.textContent = stored === 'dark' ? 'ダーク' : 'ライト';
      }
      renderUI();
    });
  </script>
