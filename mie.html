<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三重・伊勢志摩 家族旅行 リアルタイム旅程ナビ</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0b1120;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }
    header {
      background: #090d16;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }
    .badge-date {
      font-size: 0.75rem;
      background: #1e293b;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Weather Alert */
    .weather-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
    }
    .weather-icon { font-size: 1.5rem; line-height: 1; }
    .weather-body strong { color: #60a5fa; }

    /* Switch Tabs */
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .tab-btn small {
      display: block;
      font-size: 0.72rem;
      font-weight: 400;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      flex-wrap: wrap;
    }
    .time-pills { display: flex; gap: 6px; }
    .time-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .time-pill.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* Summary Card */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .summary-title { font-size: 0.98rem; font-weight: 700; color: #ffffff; }
    .summary-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-a { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-b { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .summary-desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }
    .route-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Timeline Slot Card */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .slot-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .slot-card.must { border-left: 5px solid var(--danger); }
    .slot-card.flex { border-left: 5px solid var(--primary); }
    .slot-card.opt { border-left: 5px solid var(--purple); }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .slot-time {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .slot-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-must { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
    .badge-flex { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid var(--primary); }
    .badge-opt { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid var(--purple); }

    .slot-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    /* 7 Factors Grid (Expanded) */
    .factors-box {
      background: var(--card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .factor-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .factor-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
    }
    .factor-header.accent { color: var(--accent); }
    .factor-header.danger { color: #f87171; }
    .factor-header.success { color: #34d399; }
    .factor-header.purple { color: #c084fc; }

    .factor-content {
      font-size: 0.84rem;
      color: #e2e8f0;
      line-height: 1.45;
      padding-left: 20px;
    }
    .factor-content ul {
      list-style-type: disc;
      padding-left: 16px;
      margin-top: 2px;
    }
    .factor-content li {
      margin-bottom: 2px;
    }

    .map-btn-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1e3a8a;
      color: #93c5fd;
      padding: 3px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: 600;
      margin-top: 4px;
      width: fit-content;
    }

    /* Bottom Nav / Share */
    .bottom-actions {
      margin-top: 24px;
      text-align: center;
    }
    .share-btn {
      background: #06c755;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="container" style="padding:0;">
      <div class="header-top">
        <div class="title">🗺️ 三重家族旅行 リアルタイムナビ</div>
        <div class="badge-date">11/02(月)〜11/03(火)</div>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- Weather Forecast Indicator -->
    <div class="weather-card">
      <div class="weather-icon">☁️➔🌧️</div>
      <div class="weather-body">
        <strong>天候予測: 最初は曇り、午後から雨予報</strong><br>
        午前中の曇天のうちに外観・参拝（内宮または夫婦岩）を前倒し攻略。雨が本降りになる午後は屋内散策（おかげ横丁・鳥羽水族館・温泉宿）へ即時シフト。
      </div>
    </div>

    <!-- Departure Offset Pill Selector -->
    <div class="controls-bar">
      <span>🚗 出発時刻（全体時刻が自動スライド）:</span>
      <div class="time-pills">
        <button class="time-pill" onclick="setDepartureOffset(-60)">6:00発</button>
        <button class="time-pill active" onclick="setDepartureOffset(0)">7:00発（標準）</button>
      </div>
    </div>

    <!-- Plan Tabs -->
    <div class="tab-group">
      <button class="tab-btn active" id="tab-a" onclick="switchPlan('A')">
        ⛩️ プランA：内宮直撃
        <small>渋滞前・雨前先攻</small>
      </button>
      <button class="tab-btn" id="tab-b" onclick="switchPlan('B')">
        🌊 プランB：夫婦岩迂回
        <small>内宮満車・雨天時BCP</small>
      </button>
    </div>

    <!-- Active Plan Summary -->
    <div class="summary-card" id="summary-card">
      <!-- Injected by JS -->
    </div>

    <!-- Timeline Container (Fully Expanded ①〜⑦) -->
    <div class="timeline" id="timeline-container">
      <!-- Injected by JS -->
    </div>

    <!-- Bottom Actions -->
    <div class="bottom-actions">
      <button class="share-btn" onclick="copyCurrentPlan()">📋 このプラン（①〜⑦全文）をコピーしてLINE共有</button>
    </div>

  </div>

    function shiftTime(timeStr, offsetMinutes) {
      if (!timeStr || timeStr === "翌日") return timeStr;
      const [h, m] = timeStr.split(':').map(Number);
      let totalM = h * 60 + m + offsetMinutes;
      if (totalM < 0) totalM += 24 * 60;
      const newH = Math.floor(totalM / 60) % 24;
      const newM = totalM % 60;
      return `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
    }

    function renderUI() {
      const plan = TRIP_DATA.plans[TRIP_DATA.activePlan];
      const offset = TRIP_DATA.baseOffsetMinutes;

      // Summary
      const summaryCard = document.getElementById('summary-card');
      summaryCard.innerHTML = `
        <div class="summary-header">
          <div class="summary-title">${plan.name}</div>
          <span class="summary-badge ${plan.badgeClass}">${plan.badge}</span>
        </div>
        <p class="summary-desc">${plan.desc}</p>
        <a href="${plan.overallMap}" target="_blank" class="route-link-btn">🗺️ Googleマップ全体ルートを開く</a>
      `;

      // Timeline (Expanded ①〜⑦)
      const timeline = document.getElementById('timeline-container');
      timeline.innerHTML = plan.items.map(item => {
        const start = shiftTime(item.baseStart, offset);
        const end = shiftTime(item.baseEnd, offset);
        const timeDisplay = end ? `${start}〜${end}` : start;
        const f = item.factors;

        return `
          <div class="slot-card ${item.type}">
            <div class="slot-header">
              <span class="slot-time">${timeDisplay}</span>
              <span class="slot-badge ${item.badgeClass}">${item.badgeText}</span>
            </div>
            <div class="slot-title">${item.title}</div>
            
            <div class="factors-box">
              <div class="factor-item">
                <div class="factor-header">① 概要</div>
                <div class="factor-content">${f.overview}</div>
              </div>
              <div class="factor-item">
                <div class="factor-header success">② 立ち回り＆攻略</div>
                <div class="factor-content">${f.tactics}</div>
              </div>
              <div class="factor-item">
                <div class="factor-header accent">③ 代替不可名物・限定体験</div>
                <div class="factor-content">${f.mustTry}</div>
              </div>
              <div class="factor-item">
                <div class="factor-header purple">④ ついでに巡れる名所・スイーツ</div>
                <div class="factor-content">${f.plusOne}</div>
              </div>
              <div class="factor-item">
                <div class="factor-header">⑤ 次エリア事前Tips</div>
                <div class="factor-content">${f.tips}</div>
              </div>
              <div class="factor-item">
                <div class="factor-header accent">⑥ 交通・移動・駐車場評価</div>
                <div class="factor-content">${f.transit}</div>
              </div>
              <div class="factor-item">
                <div class="factor-header danger">⑦ スキップ基準・損切りタイムゲート</div>
                <div class="factor-content">${f.skipLimit}</div>
              </div>
            </div>

            <a href="${f.mapUrl}" target="_blank" class="map-btn-inline">📍 Googleマップでスポットを開く</a>
          </div>
        `;
      }).join('');
    }

    function switchPlan(planId) {
      TRIP_DATA.activePlan = planId;
      document.getElementById('tab-a').classList.toggle('active', planId === 'A');
      document.getElementById('tab-b').classList.toggle('active', planId === 'B');
      renderUI();
    }

    function setDepartureOffset(mins) {
      TRIP_DATA.baseOffsetMinutes = mins;
      const pills = document.querySelectorAll('.time-pill');
      pills[0].classList.toggle('active', mins === -60);
      pills[1].classList.toggle('active', mins === 0);
      renderUI();
    }

    function copyCurrentPlan() {
      const plan = TRIP_DATA.plans[TRIP_DATA.activePlan];
      const offset = TRIP_DATA.baseOffsetMinutes;
      const lines = [
        `【${plan.name}】`,
        `天候考慮: 午前曇り(屋外参拝優先) / 午後雨(屋内・温泉シフト)`,
        `全体ルート: ${plan.overallMap}`,
        "",
        "【スケジュール】"
      ];
      plan.items.forEach(it => {
        const s = shiftTime(it.baseStart, offset);
        const e = shiftTime(it.baseEnd, offset);
        const f = it.factors;
        lines.push(`■ ${s}〜${e} ${it.title}`);
        lines.push(`  ① 概要: ${f.overview.replace(/<br>/g, ' / ')}`);
        lines.push(`  ② 立ち回り＆攻略: ${f.tactics.replace(/<br>/g, ' / ')}`);
        lines.push(`  ③ 代替不可名物: ${f.mustTry}`);
        lines.push(`  ④ ついで名所: ${f.plusOne}`);
        lines.push(`  ⑤ 事前Tips: ${f.tips}`);
        lines.push(`  ⑥ 交通・駐車場: ${f.transit.replace(/<br>/g, ' / ')}`);
        lines.push(`  ⑦ 損切りゲート: ${f.skipLimit}`);
        lines.push(`  ・ 地図: ${f.mapUrl}`);
        lines.push(``);
      });
      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        alert('①〜⑦完全展開プランをクリップボードにコピーしました！そのままLINEに貼り付けられます。');
      }).catch(() => {
        alert('コピーに失敗しました。');
      });
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', renderUI);
  </script>
