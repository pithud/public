<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三重・伊勢志摩 家族旅行 リアルタイム旅程ナビ</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0b1120;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 70px;
    }
    header {
      background: #090d16;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }
    .badge-origin {
      font-size: 0.75rem;
      background: #1e293b;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Weather Alert */
    .weather-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
    }
    .weather-icon { font-size: 1.5rem; line-height: 1; }
    .weather-body strong { color: #60a5fa; }

    /* Switch Tabs (3 Plans) */
    .tab-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .tab-btn small {
      display: block;
      font-size: 0.7rem;
      font-weight: 400;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 14px;
      font-size: 0.82rem;
      flex-wrap: wrap;
    }
    .time-pills { display: flex; gap: 6px; }
    .time-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .time-pill.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }

    /* Day Filter Pills */
    .day-filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .day-pill {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .day-pill.active {
      background: #1e3a8a;
      color: #93c5fd;
      border-color: #60a5fa;
    }

    /* Summary Card */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .summary-title { font-size: 0.98rem; font-weight: 700; color: #ffffff; }
    .summary-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-1 { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-2 { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid #38bdf8; }
    .badge-3 { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .summary-desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }
    
    .route-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .route-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .route-link-btn.sub {
      background: #334155;
      color: #e2e8f0;
    }

    /* Day Divider */
    .day-divider {
      background: linear-gradient(90deg, #1e3a8a, #0f172a);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 10px 14px;
      margin: 20px 0 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-divider-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }
    .day-divider-sub {
      font-size: 0.75rem;
      color: #93c5fd;
    }

    /* Timeline Slot Card */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .slot-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .slot-card.must { border-left: 5px solid var(--danger); }
    .slot-card.flex { border-left: 5px solid var(--primary); }
    .slot-card.opt { border-left: 5px solid var(--purple); }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .slot-time {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .slot-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-must { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
    .badge-flex { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid var(--primary); }
    .badge-opt { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid var(--purple); }

    .slot-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }

    /* 7 Factors Grid */
    .factors-box {
      background: var(--card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .factor-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .factor-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
    }
    .factor-header.accent { color: var(--accent); }
    .factor-header.danger { color: #f87171; }
    .factor-header.success { color: #34d399; }
    .factor-header.purple { color: #c084fc; }

    .factor-content {
      font-size: 0.84rem;
      color: #e2e8f0;
      line-height: 1.45;
      padding-left: 20px;
    }

    .map-btn-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1e3a8a;
      color: #93c5fd;
      padding: 3px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: 600;
      margin-top: 4px;
      width: fit-content;
    }

    /* Bottom Nav / Share */
    .bottom-actions {
      margin-top: 24px;
      text-align: center;
    }
    .share-btn {
      background: #06c755;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="container" style="padding:0;">
      <div class="header-top">
        <div class="title">🗺️ 三重家族旅行 リアルタイムナビ</div>
        <div class="badge-origin">起点：高蔵寺駅</div>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- Weather Forecast Indicator -->
    <div class="weather-card">
      <div class="weather-icon">☁️➔🌧️</div>
      <div class="weather-body">
        <strong>天候予測: 1日目は午前曇り・午後から雨 / 2日目は回復基調</strong><br>
        1日目午前中のうちに外観・参拝を前倒し攻略。雨が本降りになる午後は屋内散策（おかげ横丁・鳥羽水族館・温泉宿）へ即時シフト。
      </div>
    </div>

    <!-- Departure Offset Pill Selector -->
    <div class="controls-bar">
      <span>🚗 高蔵寺駅 出発時刻:</span>
      <div class="time-pills">
        <button class="time-pill" onclick="setDepartureOffset(-60)">6:00発</button>
        <button class="time-pill active" onclick="setDepartureOffset(0)">7:00発（標準）</button>
      </div>
    </div>

    <!-- Plan Tabs (3 Plans) -->
    <div class="tab-group">
      <button class="tab-btn active" id="tab-1" onclick="switchPlan('1')">
        ⛩️ プラン1：内宮直行
        <small>混雑前・雨前先攻</small>
      </button>
      <button class="tab-btn" id="tab-2" onclick="switchPlan('2')">
        🌲 プラン2：外宮先拝
        <small>伝統の正統順序</small>
      </button>
      <button class="tab-btn" id="tab-3" onclick="switchPlan('3')">
        🌊 プラン3：夫婦岩迂回
        <small>満車・雨天回避</small>
      </button>
    </div>

    <!-- Active Plan Summary -->
    <div class="summary-card" id="summary-card">
      <!-- Injected by JS -->
    </div>

    <!-- Day Filter Pills -->
    <div class="day-filter-bar">
      <button class="day-pill active" id="day-all-btn" onclick="filterDay('all')">全日程（1日目＆2日目）</button>
      <button class="day-pill" id="day-1-btn" onclick="filterDay('1')">📅 1日目のみ</button>
      <button class="day-pill" id="day-2-btn" onclick="filterDay('2')">📅 2日目のみ</button>
    </div>

    <!-- Timeline Container (Separated into Day 1 & Day 2) -->
    <div class="timeline" id="timeline-container">
      <!-- Injected by JS -->
    </div>

    <!-- Bottom Actions -->
    <div class="bottom-actions">
      <button class="share-btn" onclick="copyCurrentPlan()">📋 このプラン（1日目・2日目全文）をコピーしてLINE共有</button>
    </div>

  </div>

  <script>

            {

    function shiftTime(timeStr, offsetMinutes) {
      if (!timeStr || timeStr === "翌日") return timeStr;
      const [h, m] = timeStr.split(':').map(Number);
      let totalM = h * 60 + m + offsetMinutes;
      if (totalM < 0) totalM += 24 * 60;
      const newH = Math.floor(totalM / 60) % 24;
      const newM = totalM % 60;
      return `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
    }

    function renderUI() {
      const plan = TRIP_DATA.plans[TRIP_DATA.activePlan];
      const offset = TRIP_DATA.baseOffsetMinutes;
      const dayFilter = TRIP_DATA.activeDayFilter;

      // Summary Card
      const summaryCard = document.getElementById('summary-card');
      summaryCard.innerHTML = `
        <div class="summary-header">
          <div class="summary-title">${plan.name}</div>
          <span class="summary-badge ${plan.badgeClass}">${plan.badge}</span>
        </div>
        <p class="summary-desc">${plan.desc}</p>
        <div class="route-links">
          <a href="${plan.overallMap}" target="_blank" class="route-link-btn">🗺️ 全体ルート（高蔵寺発着）</a>
          <a href="${plan.day1Map}" target="_blank" class="route-link-btn sub">🚗 1日目ルート</a>
          <a href="${plan.day2Map}" target="_blank" class="route-link-btn sub">🚗 2日目ルート</a>
        </div>
      `;

      // Timeline Container with clear Day 1 & Day 2 Dividers
      const timeline = document.getElementById('timeline-container');
      let html = '';

      plan.days.forEach(day => {
        if (dayFilter !== 'all' && String(day.dayNum) !== dayFilter) return;

        html += `
          <div class="day-divider">
            <div>
              <div class="day-divider-title">📅 ${day.dayNum}日目：${day.dateStr}</div>
              <div class="day-divider-sub">${day.subTitle}</div>
            </div>
          </div>
        `;

        day.items.forEach(item => {
          const start = shiftTime(item.baseStart, offset);
          const end = shiftTime(item.baseEnd, offset);
          const timeDisplay = end ? `${start}〜${end}` : start;
          const f = item.factors;

          html += `
            <div class="slot-card ${item.type}">
              <div class="slot-header">
                <span class="slot-time">${timeDisplay}</span>
                <span class="slot-badge ${item.badgeClass}">${item.badgeText}</span>
              </div>
              <div class="slot-title">${item.title}</div>
              
              <div class="factors-box">
                <div class="factor-item">
                  <div class="factor-header">① 概要</div>
                  <div class="factor-content">${f.overview}</div>
                </div>
                <div class="factor-item">
                  <div class="factor-header success">② 立ち回り＆攻略</div>
                  <div class="factor-content">${f.tactics}</div>
                </div>
                <div class="factor-item">
                  <div class="factor-header accent">③ 代替不可名物・限定体験</div>
                  <div class="factor-content">${f.mustTry}</div>
                </div>
                <div class="factor-item">
                  <div class="factor-header purple">④ ついでに巡れる名所・スイーツ</div>
                  <div class="factor-content">${f.plusOne}</div>
                </div>
                <div class="factor-item">
                  <div class="factor-header">⑤ 次エリア事前Tips</div>
                  <div class="factor-content">${f.tips}</div>
                </div>
                <div class="factor-item">
                  <div class="factor-header accent">⑥ 交通・移動・駐車場評価</div>
                  <div class="factor-content">${f.transit}</div>
                </div>
                <div class="factor-item">
                  <div class="factor-header danger">⑦ スキップ基準・損切りタイムゲート</div>
                  <div class="factor-content">${f.skipLimit}</div>
                </div>
              </div>

              <a href="${f.mapUrl}" target="_blank" class="map-btn-inline">📍 Googleマップでスポットを開く</a>
            </div>
          `;
        });
      });

      timeline.innerHTML = html;
    }

    function switchPlan(planId) {
      TRIP_DATA.activePlan = planId;
      document.getElementById('tab-1').classList.toggle('active', planId === '1');
      document.getElementById('tab-2').classList.toggle('active', planId === '2');
      document.getElementById('tab-3').classList.toggle('active', planId === '3');
      renderUI();
    }

    function setDepartureOffset(mins) {
      TRIP_DATA.baseOffsetMinutes = mins;
      const pills = document.querySelectorAll('.time-pill');
      pills[0].classList.toggle('active', mins === -60);
      pills[1].classList.toggle('active', mins === 0);
      renderUI();
    }

    function filterDay(dayKey) {
      TRIP_DATA.activeDayFilter = dayKey;
      document.getElementById('day-all-btn').classList.toggle('active', dayKey === 'all');
      document.getElementById('day-1-btn').classList.toggle('active', dayKey === '1');
      document.getElementById('day-2-btn').classList.toggle('active', dayKey === '2');
      renderUI();
    }

    function copyCurrentPlan() {
      const plan = TRIP_DATA.plans[TRIP_DATA.activePlan];
      const offset = TRIP_DATA.baseOffsetMinutes;
      const lines = [
        `【${plan.name}】（起点: 高蔵寺駅）`,
        `全体ルート: ${plan.overallMap}`,
        `1日目ルート: ${plan.day1Map}`,
        `2日目ルート: ${plan.day2Map}`,
        "",
        "【スケジュール】"
      ];

      plan.days.forEach(day => {
        lines.push(`\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
        lines.push(`■ ${day.dayNum}日目：${day.dateStr} 【${day.subTitle}】`);
        lines.push(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);

        day.items.forEach(it => {
          const s = shiftTime(it.baseStart, offset);
          const e = shiftTime(it.baseEnd, offset);
          const f = it.factors;
          lines.push(`\n▶ ${s}〜${e} ${it.title}`);
          lines.push(`  ① 概要: ${f.overview.replace(/<br>/g, ' / ')}`);
          lines.push(`  ② 立ち回り＆攻略: ${f.tactics.replace(/<br>/g, ' / ')}`);
          lines.push(`  ③ 代替不可名物: ${f.mustTry}`);
          lines.push(`  ④ ついで名所: ${f.plusOne}`);
          lines.push(`  ⑤ 事前Tips: ${f.tips}`);
          lines.push(`  ⑥ 交通・駐車場: ${f.transit.replace(/<br>/g, ' / ')}`);
          lines.push(`  ⑦ 損切りゲート: ${f.skipLimit}`);
          lines.push(`  ・ 地図: ${f.mapUrl}`);
        });
      });

      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        alert('1日目・2日目の全日程（①〜⑦完全展開）をコピーしました！そのままLINEに貼り付けられます。');
      }).catch(() => {
        alert('コピーに失敗しました。');
      });
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', renderUI);
  </script>
