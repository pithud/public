<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>三重 ｜ 伊勢 ＋ 志摩 旅アルバム</title>
  <script>
    (function() {
      var t = localStorage.getItem('trip_nav_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #0284c7;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #090d16;
      --surface: #131b2e;
      --surface-subtle: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --card-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 15px;
      padding-bottom: 60px;
    }
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    [data-theme="dark"] .header-bar { background: rgba(19, 27, 46, 0.92); }
    .brand-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .theme-toggle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .theme-toggle-btn:hover {
      border-color: var(--primary);
      transform: scale(1.05);
    }
    .main-wrap { max-width: 580px; margin: 0 auto; padding: 20px 16px; }
    .trip-summary { margin-bottom: 24px; }
    .trip-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.01em; }
    .trip-meta { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .nav-list { display: flex; flex-direction: column; gap: 12px; }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--card-shadow);
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-item:hover { background: var(--surface-subtle); border-color: var(--primary); }
    .item-left { display: flex; align-items: center; gap: 14px; }
    .badge-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      min-width: 48px;
      text-align: center;
    }
    .badge-prod { background: rgba(2, 132, 199, 0.12); color: var(--primary); }
    .badge-dev { background: rgba(217, 119, 6, 0.12); color: #d97706; }
    .badge-log { background: rgba(16, 185, 129, 0.15); color: #059669; }
    .item-body { display: flex; flex-direction: column; gap: 2px; }
    .item-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .item-desc { font-size: 12.5px; color: var(--text-muted); }
    .item-arrow { color: var(--text-muted); font-size: 14px; }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .back-home:hover { color: var(--primary); }
  </style>
</head>
<body>
  <header class="header-bar">
    <div class="brand-title">三重 ｜ 伊勢 ＋ 志摩 旅アルバム</div>
    <button class="theme-toggle-btn" id="themeBtn" aria-label="テーマ切替">🌙</button>
  </header>

  <main class="main-wrap">
    <div class="trip-summary">
      <h1 class="trip-title">三重 ｜ 伊勢 ＋ 志摩 弾丸行動アルバム</h1>
      <div class="trip-meta">2026年11月2日（月・平日）〜 11月3日（火・祝）</div>
    </div>

    <div class="nav-list">
      <a href="prod.html" class="nav-item">
        <div class="item-left">
          <span class="badge-tag badge-prod">最終版</span>
          <div class="item-body">
            <span class="item-title">最終版タイムチャート（確定旅程）</span>
            <span class="item-desc">三重 ｜ 伊勢 ＋ 志摩 旅アルバム 本番しおり・攻略戦術・チェックポイント</span>
          </div>
        </div>
        <span class="item-arrow">➔</span>
      </a>

      <a href="album.html" class="nav-item">
        <div class="item-left">
          <span class="badge-tag badge-log">アルバム</span>
          <div class="item-body">
            <span class="item-title">旅アルバム（実走記録）</span>
            <span class="item-desc">Googleマップ タイムライン ＆ Apple Health 実測同期完了版</span>
          </div>
        </div>
        <span class="item-arrow">➔</span>
      </a>
    </div>

    <a href="../index.html" class="back-home">◀ 旅行総合ポータルへ戻る</a>
  </main>

  <script>
    function updateThemeIcon(t) {
      var btn = document.getElementById('themeBtn');
      if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('trip_nav_theme', next);
      updateThemeIcon(next);
    }
    (function() {
      var t = localStorage.getItem('trip_nav_theme') || 'light';
      updateThemeIcon(t);
      var btn = document.getElementById('themeBtn');
      if (btn) btn.addEventListener('click', toggleTheme);
    })();
  </script>
</body>
</html>
